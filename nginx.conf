# ==========================================================
# 3. STAGING API - api.aadikarta.org
# ==========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aadikarta.org;

    ssl_certificate /etc/letsencrypt/live/aadikarta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aadikarta.org/privkey.pem;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_staging_api astro_api_staging;
        proxy_pass http://$upstream_staging_api:8000;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }


    location /chat/ws {
        set $upstream_staging_api astro_api_staging;
        proxy_pass http://$upstream_staging_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

