# ==========================================================
# 8. leads.ai
# ==========================================================

server {
    listen 443 ssl default_server;
    server_name _; # Wildcard catch-all for any incoming IP address
    
    ssl_certificate /etc/letsencrypt/live/aadikarta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aadikarta.org/privkey.pem;

    location /api/stream/ {
        proxy_pass http://172.17.0.1:8002/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://172.17.0.1:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://172.17.0.1:4005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# ==========================================================
# 9. sales.ai
# ==========================================================

server {
    listen 443 ssl;
    server_name _; # Wildcard catch-all for any incoming IP address
    
    ssl_certificate /etc/letsencrypt/live/aadikarta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aadikarta.org/privkey.pem;

    location / {
        proxy_pass http://172.17.0.1:3005; # 172.17.0.1 is the Docker host gateway IP
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CRITICAL: Allow real-time Server-Sent Events (SSE) streams to flow unbuffered
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

