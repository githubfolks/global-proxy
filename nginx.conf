server {
    listen 80;
    listen [::]:80 default_server;
    server_name itgoachq.org www.itgoachq.org api.itgoachq.org aadikarta.org www.aadikarta.org dev.aadikarta.org api.aadikarta.org admin.aadikarta.org n8n.aadikarta.org dev-meet.aadikarta.org wa.aadikarta.org;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ==========================================================
# 6. MIROTALK STAGING - dev-meet.aadikarta.org
# ==========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev-meet.aadikarta.org;

    ssl_certificate /etc/letsencrypt/live/aadikarta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aadikarta.org/privkey.pem;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_mirotalk astro_mirotalk_staging;
        proxy_pass http://$upstream_mirotalk:3010;
        include /etc/nginx/conf.d/proxy.conf;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}


