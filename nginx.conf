server {
    listen 80;
    listen [::]:80 default_server;
    server_name itgoachq.org www.itgoachq.org api.itgoachq.org aadikarta.org www.aadikarta.org dev.aadikarta.org api.aadikarta.org admin.aadikarta.org n8n.aadikarta.org dev-meet.aadikarta.org;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name localhost;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    # Use variables to prevent Nginx from crashing if hosts are not found at startup
    set $upstream_dashboard dashboard;
    set $upstream_app app;

    # Frontend Dashboard
    location / {
        proxy_pass http://$upstream_dashboard:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/v1 {
        proxy_pass http://$upstream_app:3000/api/v1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Standard timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}


