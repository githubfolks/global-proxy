server {
    listen 80;
    listen [::]:80 default_server;
    server_name itgoachq.org www.itgoachq.org api.itgoachq.org aadikarta.org www.aadikarta.org api.aadikarta.org admin.aadikarta.org meet.aadikarta.org;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name itgoachq.org www.itgoachq.org;

    ssl_certificate /etc/letsencrypt/live/aadikarta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aadikarta.org/privkey.pem;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_itgoa_web itgoa-web;
        proxy_pass http://$upstream_itgoa_web:80;
        include /etc/nginx/conf.d/proxy.conf;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.itgoachq.org;

    ssl_certificate /etc/letsencrypt/live/aadikarta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aadikarta.org/privkey.pem;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_itgoa_api itgoa-api;
        proxy_pass http://$upstream_itgoa_api:3000;
        include /etc/nginx/conf.d/proxy.conf;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}


# ==========================================================
# 1. PRODUCTION - aadikarta.org
# ==========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aadikarta.org www.aadikarta.org;

    ssl_certificate /etc/letsencrypt/live/aadikarta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aadikarta.org/privkey.pem;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_prod_web astro_web;
        proxy_pass http://$upstream_prod_web:80;
        include /etc/nginx/conf.d/proxy.conf;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}


# ==========================================================
# 3. STAGING API - api.aadikarta.org
# ==========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aadikarta.org;

    ssl_certificate /etc/letsencrypt/live/aadikarta.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aadikarta.org/privkey.pem;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_api astro_api;
        proxy_pass http://$upstream_api:8000;
        include /etc/nginx/conf.d/proxy.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }


    location /chat/ws {
        set $upstream_api astro_api;
        proxy_pass http://$upstream_api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

