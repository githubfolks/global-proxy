server {
    listen 80;
    listen [::]:80 default_server;
    server_name itgoachq.org www.itgoachq.org api.itgoachq.org aadikarta.org www.aadikarta.org dev.aadikarta.org api.aadikarta.org admin.aadikarta.org n8n.aadikarta.org dev-meet.aadikarta.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
