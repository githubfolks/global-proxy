# Local Nginx Configuration for Multi-Site Debugging
# HTTP ONLY (No SSL)

server {
    listen 80;
    listen [::]:80;
    server_name localhost itgoachq.org www.itgoachq.org aadikarta.org www.aadikarta.org dev.aadikarta.org api.aadikarta.org admin.aadikarta.org;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_itgoa_web itgoa-web;
        proxy_pass http://$upstream_itgoa_web:80;
        include /etc/nginx/conf.d/proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.localhost api.itgoachq.org;

    # Docker internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        set $upstream_itgoa_api itgoa-api;
        proxy_pass http://$upstream_itgoa_api:3000;
        include /etc/nginx/conf.d/proxy.conf;
    }
}

# Local versions for Aadikarta (HTTP only)
server {
    listen 80;
    server_name aadikarta.org www.aadikarta.org;
    location / {
        proxy_pass http://172.25.0.1:3002;
        include /etc/nginx/conf.d/proxy.conf;
    }
}

server {
    listen 80;
    server_name dev.aadikarta.org;
    location / {
        proxy_pass http://172.25.0.1:4002;
        include /etc/nginx/conf.d/proxy.conf;
    }
}

server {
    listen 80;
    server_name api.aadikarta.org;
    location / {
        proxy_pass http://172.25.0.1:9000;
        include /etc/nginx/conf.d/proxy.conf;
    }
}

server {
    listen 80;
    server_name admin.aadikarta.org;
    location / {
        proxy_pass http://172.25.0.1:4001;
        include /etc/nginx/conf.d/proxy.conf;
    }
}
